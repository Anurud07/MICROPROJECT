<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Registration | Matchday Tournament Manager</title><link rel="stylesheet" href="style.css">
<style>
.auth-shell{max-width:960px;margin:32px auto;padding:20px}
.auth-card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:24px;box-shadow:0 8px 28px #14213d0d;margin:16px 0}
.auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.auth-card h1,.auth-card h2{color:#991b1b;margin-bottom:8px}
.auth-card label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
.auth-card input,.auth-card select{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:8px;background:white;color:#202b3c}
.auth-card button,.action-btn{padding:10px 14px;background:#dc2626;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:700;margin:8px 6px 0 0}
.auth-card button:disabled{opacity:.6;cursor:wait}
.btn-muted{background:#64748b!important}.btn-green{background:#15803d!important}
.message{padding:10px 12px;background:#fef2f2;color:#991b1b;border-radius:8px;margin-top:12px;white-space:pre-wrap}
.muted{color:#758198}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#fee2e2;color:#991b1b;font-size:12px;font-weight:700}
.portal-table{width:100%;border-collapse:collapse;margin-top:12px}.portal-table th,.portal-table td{text-align:left;padding:10px;border-bottom:1px solid #e5eaf2}.portal-table th{background:#fef2f2}
@media(max-width:650px){.auth-grid{grid-template-columns:1fr}.auth-shell{padding:12px}}
</style>
</head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">M</span><span><strong>matchday.</strong><small>TOURNAMENT MANAGER</small></span></a><span class="season">COLLEGE LEAGUE · 2026</span></header>

<main class="auth-shell"><section class="auth-card"><p class="kicker">JOIN THE TOURNAMENT</p><h1>Student Registration</h1><p class="muted">Create a demo account and select one game. Your application will remain pending until approved by the admin.</p>
<form id="registerForm"><div class="auth-grid">
<div><label for="fullName">Full name</label><input id="fullName" required maxlength="80"></div>
<div><label for="rollNumber">College roll number</label><input id="rollNumber" required maxlength="30"></div>
<div><label for="course">Course / Branch</label><input id="course" required maxlength="80"></div>
<div><label for="email">Email</label><input id="email" type="email" required maxlength="120"></div>
<div><label for="password">Password</label><input id="password" type="password" required minlength="4"></div>
<div><label for="game">Choose one game</label><select id="game" required><option value="">Select a game</option><option>Football</option><option>Cricket</option><option>Badminton</option><option>Basketball</option><option>Volleyball</option><option>Chess</option></select></div>
</div><button type="submit">Submit Registration</button></form><p id="message" class="message" hidden></p>
<p style="margin-top:14px">Already registered? <a href="login.html" target="_blank" rel="noopener noreferrer">Login</a> · <a href="index.html">Back to website</a></p></section></main>

<script src="app.js"></script><script src="register.js"></script></body></html>
