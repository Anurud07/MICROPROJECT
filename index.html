
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Portal | Matchday Tournament Manager</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .portal-shell{max-width:520px;margin:48px auto;padding:20px}
    .portal-card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:28px;box-shadow:0 8px 28px #14213d0d;margin:16px 0}
    .portal-card h1,.portal-card h2{color:#991b1b;margin-bottom:10px}
    .portal-card label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
    .portal-card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dce5;border-radius:8px;background:#fff;color:#202b3c}
    .portal-btn{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;padding:12px 14px;background:#dc2626;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:700;margin-top:14px}
    .portal-btn:hover{background:#b91c1c}
    .student-btn{background:#fff;color:#991b1b;border:1px solid #dc2626}
    .student-btn:hover{background:#fef2f2}
    .message{padding:10px 12px;background:#fef2f2;color:#991b1b;border-radius:8px;margin-top:12px;white-space:pre-wrap}
    .muted{color:#758198}
    .divider{border:0;border-top:1px solid #e5eaf2;margin:22px 0}
    @media(max-width:600px){.portal-shell{padding:12px;margin:24px auto}.portal-card{padding:20px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">M</span>
      <span><strong>matchday.</strong><small>TOURNAMENT MANAGER</small></span>
    </a>
    <span class="season">COLLEGE LEAGUE · 2026</span>
  </header>

  <main class="portal-shell">
    <section class="portal-card">
      <p class="kicker">WELCOME TO MATCHDAY</p>
      <h1>Login Portal</h1>
      <p class="muted">Choose how you want to continue.</p>

      <a class="portal-btn" href="#admin-login">Login as Admin</a>
      <a class="portal-btn student-btn" href="register.html">Register as Student</a>

      <hr class="divider">

      <div id="admin-login">
        <h2>Admin Login</h2>
        <p class="muted">Authorized tournament administrators only.</p>

        <form id="loginForm">
          <label for="email">Admin Email</label>
          <input id="email" name="email" type="email" placeholder="Enter admin email" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" required>

          <button class="portal-btn" type="submit">Login as Admin</button>
        </form>

        <p id="message" class="message" hidden></p>
      </div>
    </section>
    <p class="muted" style="text-align:center;font-size:12px">Matchday Tournament Manager · 2026</p>
  </main>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
